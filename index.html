<div class="mc-tiers">

    <div class="mc-tier-tabs">
        <button class="mc-tier-tab active" onclick="showTierCategory('overall', this)">
            <span>🏆</span> Overall
        </button>

        <button class="mc-tier-tab" onclick="showTierCategory('ltms', this)">
            <span>⚔</span> LTMs
        </button>

        <button class="mc-tier-tab" onclick="showTierCategory('vanilla', this)">
            <span>⬡</span> Vanilla
        </button>

        <button class="mc-tier-tab" onclick="showTierCategory('uhc', this)">
            <span>♥</span> UHC
        </button>

        <button class="mc-tier-tab" onclick="showTierCategory('pot', this)">
            <span>⚗</span> Pot
        </button>

        <button class="mc-tier-tab" onclick="showTierCategory('netherop', this)">
            <span>◉</span> NetherOP
        </button>

        <button class="mc-tier-tab" onclick="showTierCategory('smp', this)">
            <span>◈</span> SMP
        </button>

        <button class="mc-tier-tab" onclick="showTierCategory('sword', this)">
            <span>⚔</span> Sword
        </button>

        <button class="mc-tier-tab" onclick="showTierCategory('axe', this)">
            <span>◈</span> Axe
        </button>

        <button class="mc-tier-tab" onclick="showTierCategory('mace', this)">
            <span>⚒</span> Mace
        </button>
    </div>


    <div class="mc-tier-panel">

        <div class="mc-tier-topbar">
            <span class="mc-tier-info">
                ⓘ Information
            </span>

            <span class="mc-tier-server">
                PVP CLUB
                <b>elysiumsmp.playwithbao.com</b>
                <span>●</span>
            </span>
        </div>


        <div class="mc-tier-headings">
            <span>#</span>
            <span>PLAYER</span>
            <span>REGION</span>
            <span>TIERS</span>
        </div>


        <div id="mcTierRows"></div>

    </div>


    <p class="mc-tier-note">
        MCTIERS-style PvP rankings. Tier data is sample data and can be edited in script.js.
    </p>

</div>
